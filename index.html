<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F1EDE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="成长系统">
<meta name="format-detection" content="telephone=no">
<title>成长系统</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="train">
      <svg viewBox="0 0 24 24"><path d="M3 9v6M6.5 7v10M17.5 7v10M21 9v6M6.5 12h11"/></svg>
      <span>训练</span>
    </button>
    <button class="tab" data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M8 7.5c0-1 1-1.4 1-2.5M12 7.5c0-1 1-1.4 1-2.5M16 7.5c0-1 1-1.4 1-2.5"/></svg>
      <span>饮食</span>
    </button>
    <button class="tab" data-tab="study">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"/><path d="M8 7h7M8 11h7M8 15h4"/></svg>
      <span>学习</span>
    </button>
    <button class="tab" data-tab="expense">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M7 6V4h10v2M16 12h5M16 12a2 2 0 1 0 0 4h5"/></svg>
      <span>支出</span>
    </button>
    <button class="tab" data-tab="me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-3.6 3.4-5.6 7.5-5.6s7.5 2 7.5 5.6"/></svg>
      <span>我的</span>
    </button>
  </nav>
</div>

<div class="mask" id="mask" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div id="toast"></div>

<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
