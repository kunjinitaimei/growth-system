<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0A0C0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="成长系统">
<meta name="format-detection" content="telephone=no">
<title>成长系统 · 饮食</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/></svg>
      <span>今日</span>
    </button>
    <button class="tab" data-tab="log">
      <svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v15l-3-2-3 2-3-2-3 2-3-2V5a1 1 0 0 1 1-1Z"/><path d="M8 8h8M8 12h8M8 16h4" class="ln"/></svg>
      <span>记录</span>
    </button>
    <button class="tab" data-tab="foods">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4" class="ln"/></svg>
      <span>食物库</span>
    </button>
    <button class="tab" data-tab="me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-3.6 3.4-5.6 7.5-5.6s7.5 2 7.5 5.6" class="ln"/></svg>
      <span>我的</span>
    </button>
  </nav>
</div>

<div class="sheet-mask" id="mask" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
